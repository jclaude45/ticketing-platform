name: Trivy — container & filesystem scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan every Monday at 04:00 UTC
    - cron: '0 4 * * 1'

jobs:
  filesystem-scan:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Scan filesystem — table output (fails on CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL
          exit-code: '1'

      - name: Scan filesystem — SARIF upload (optional)
        uses: aquasecurity/trivy-action@0.28.0
        if: always()
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem

  docker-build-and-scan:
    name: Build & scan Docker image (backend)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image (production stage)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: production
          push: false
          load: true
          tags: zaya-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image — table output (fails on CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: zaya-backend:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: '1'

      - name: Scan image — SARIF upload (optional)
        uses: aquasecurity/trivy-action@0.28.0
        if: always()
        with:
          image-ref: zaya-backend:${{ github.sha }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload image scan SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-image.sarif
          category: trivy-docker-backend
