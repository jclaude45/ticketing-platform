name: ticketing_scanner
description: Secure ticket validation app for event controllers
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.10
  # HTTP & Network
  dio: ^5.4.1
  connectivity_plus: ^6.0.1

  # QR Scanner
  mobile_scanner: ^4.0.0

  # Local Storage
  sqflite: ^2.3.2
  path: ^1.8.3
  # Secure Storage
  flutter_secure_storage: ^9.0.0

  # Biometrics
  # UI
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  permission_handler: ^11.3.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.3.3
  get_it: ^7.6.7
  audioplayers: ^6.8.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
