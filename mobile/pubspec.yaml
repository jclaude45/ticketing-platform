name: ticketing_scanner
description: Secure ticket validation app for event controllers
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.10
  # HTTP & Network
  dio: ^5.4.1
  connectivity_plus: ^6.0.1

  # QR Scanner
  mobile_scanner: ^4.0.0

  # Local Storage
  sqflite: ^2.3.2
  path: ^1.8.3
  # Secure Storage
  flutter_secure_storage: ^9.0.0

  # Biometrics
  # UI
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  permission_handler: ^11.3.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.3.3
  get_it: ^7.6.7
  audioplayers: ^6.8.1
  lottie: ^3.6.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/
    - assets/animations/
  fonts:
    # Satoshi (Indian Type Foundry, Fontshare free licence): zcontrole's typeface
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi-Light.otf
          weight: 300
        - asset: assets/fonts/Satoshi-LightItalic.otf
          weight: 300
          style: italic
        - asset: assets/fonts/Satoshi-Regular.otf
        - asset: assets/fonts/Satoshi-Italic.otf
          style: italic
        - asset: assets/fonts/Satoshi-Medium.otf
          weight: 500
        - asset: assets/fonts/Satoshi-MediumItalic.otf
          weight: 500
          style: italic
        - asset: assets/fonts/Satoshi-Bold.otf
          weight: 700
        - asset: assets/fonts/Satoshi-BoldItalic.otf
          weight: 700
          style: italic
        - asset: assets/fonts/Satoshi-Black.otf
          weight: 900
        - asset: assets/fonts/Satoshi-BlackItalic.otf
          weight: 900
          style: italic
